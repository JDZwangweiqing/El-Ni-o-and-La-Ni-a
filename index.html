<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>厄尔尼诺与拉尼娜现象演示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #f2f5f7; color: #2b3440; display: flex; justify-content: center;
    min-height: 100vh; padding: 18px; align-items: flex-start;
  }
  #app { display: flex; gap: 16px; max-width: 1500px; width: 100%; align-items: flex-start; position: relative; }
  #left { flex: 1 1 auto; min-width: 0; margin-right: 316px; }
  .stage {
    background: #fdfefe; border-radius: 14px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(30,60,90,.10); border: 1px solid #e3e9ee;
    position: relative;
  }
  /* 画布顶部三个年份下拉列表 */
  #yearSel { position: absolute; top: 14px; left: 14px; display: flex; gap: 10px; z-index: 6; }
  #yearSel select {
    padding: 7px 8px; border: 1.5px solid #cfd9e2; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #34495e; background: #fff;
    cursor: pointer; box-shadow: 0 2px 8px rgba(30,60,90,.08); outline: none;
  }
  #yearSel select:focus { border-color: #7fa8cc; }
  canvas { display: block; width: 100%; height: auto; }
  #chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    background: #fff; border: 1.5px solid #cfd9e2; color: #34495e;
    border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
    transition: all .5s ease; opacity: 0; transform: translateY(6px);
  }
  .chip.on { opacity: 1; transform: none; }
  .chip.hot { border-color: #e8604c; color: #c0392b; background: #fdf1ef; }
  .chip.cold { border-color: #3f8fbf; color: #21618c; background: #eff7fc; }
  .arrow { color: #9aa7b2; font-weight: 700; }
  #right {
    position: absolute; top: 0; bottom: 43px; right: 0; width: 300px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #right .panel:last-child { flex: 1; min-height: 0; overflow: hidden; }
  .panel {
    background: #fff; border-radius: 14px; padding: 16px;
    box-shadow: 0 4px 18px rgba(30,60,90,.08); border: 1px solid #e3e9ee;
  }
  .panel h1 { font-size: 22px; margin-bottom: 6px; }
  .panel .sub { font-size: 14px; color: #8595a5; margin-bottom: 12px; }
  .stepcard {
    border: 1.5px solid #dbe3ea; border-radius: 10px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer; transition: all .25s ease; background: #fbfdfe;
  }
  .stepcard:hover { border-color: #9db8cc; cursor: pointer; }
  .stepcard.active {
    border-color: #e8604c; background: #fff6f4;
    box-shadow: 0 2px 8px rgba(232,96,76,.15);
  }
  .stepcard.lanina.active { border-color: #3f8fbf; background: #f2f9fd; box-shadow: 0 2px 8px rgba(63,143,191,.15); }
  .stepcard.neutral.active { border-color: #8aa0b5; background: #f5f7f9; box-shadow: none; }
  .stepcard .t { font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; }
  .stepcard .t .en { font-size: 13.5px; color: #93a3b3; font-weight: 500; }
  .stepcard .d { font-size: 14px; color: #5d6d7e; margin-top: 5px; line-height: 1.6; }
  .btns { display: flex; gap: 8px; }
  .btns button {
    flex: 1; padding: 10px 0; border: 1.5px solid #cfd9e2; background: #fff;
    border-radius: 9px; font-size: 16px; cursor: pointer; color: #34495e; font-weight: 600;

  .btns button.primary { background: #34699a; border-color: #34699a; color: #fff; }
  .btns button.tg-on { background: #eaf3fb; border-color: #7fa8cc; color: #22557f; }
  .btns button.tg-off { opacity: 0.45; text-decoration: line-through; }

  #toggles { position: absolute; right: 320px; top: 335px; width: 118px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }

    padding: 10px 0; border: 1.5px solid #cfd9e2; background: #fff;
    border-radius: 9px; font-size: 15px; cursor: pointer; color: #34495e; font-weight: 600;
    box-shadow: 0 3px 12px rgba(30,60,90,.10); transition: all .2s;
  }
  #toggles button:hover { background: #f0f5f9; border-color: #9db8cc; }
  #toggles button.tg-on { background: #eaf3fb; border-color: #7fa8cc; color: #22557f; }
  #toggles button.tg-off { opacity: 0.45; text-decoration: line-through; }
  .btns button.primary:hover { background: #2c5a85; }
  .speedrow { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: #5d6d7e; margin-top: 10px; }
  .speedrow input { flex: 1; accent-color: #34699a; }
  .legend { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: #4a5b6b; }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 13px; border-radius: 3px; display: inline-block; }
  .src { font-size: 13px; color: #000000; margin-top: 10px; line-height: 1.65; }
  #err {
    display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: #c0392b; color: #fff; padding: 8px 16px; border-radius: 8px;
    font-size: 13px; z-index: 99; max-width: 90%; white-space: pre-wrap;
  }
</style>
</head>

<div id="err"></div>
<div id="app">
  <div id="left">
    <div class="stage" id="stagebox">
      <canvas id="cv" width="1080" height="750"></canvas>

    <div class="panel">

  </div>

function roundedLoop(pts, r, seg){
  var n = pts.length, out = [], cum = [0], corners = [];

  }

  var t2s = [], t3s = [];

    var a0 = pts[k], b0 = pts[(k+1)%n];
    var l1 = Math.hypot(b0[0]-a0[0], b0[1]-a0[1]) || 1;
    var r1 = Math.min(r, l1/2.5);
    t2s[k] = [ b0[0]-(b0[0]-a0[0])*r1/l1, b0[1]-(b0[1]-a0[1])*r1/l1 ];
    var c0 = pts[(k+1)%n], d0 = pts[(k+2)%n];
    var l2 = Math.hypot(d0[0]-c0[0], d0[1]-c0[1]) || 1;
    var r2 = Math.min(r, l2/2.5);
    t3s[k] = [ c0[0]+(d0[0]-c0[0])*r2/l2, c0[1]+(d0[1]-c0[1])*r2/l2 ];
  }
  for(var i = 0; i < n; i++){
    var start = (i === 0) ? t3s[n-1] : t3s[i-1];
    var end = t2s[i];
    for(var s = 0; s <= seg; s++){
      var f = s/seg;
      push([ start[0]+(end[0]-start[0])*f, start[1]+(end[1]-start[1])*f ]);
    }
    var c = pts[(i+1)%n], t2 = t2s[i], t3 = t3s[i];
    var dS = cum[cum.length - 1];
    for(var s2 = 1; s2 < seg; s2++){
      var f2 = s2/seg;
      push([
        (1-f2)*(1-f2)*t2[0] + 2*(1-f2)*f2*c[0] + f2*f2*t3[0],
        (1-f2)*(1-f2)*t2[1] + 2*(1-f2)*f2*c[1] + f2*f2*t3[1]

  /* --- 信风箭头（白色略向左弯的弧线箭头，长短粗细表示强弱；头部停在环流色带下方，不相交） --- */
  var tw = cur.tw;
  if(showTrade){
  var twn = clamp((tw - 0.28) / 1.42, 0, 1);      /* 0 弱 → 1 强 */
  var arrW = 2.8 + 3.2 * twn;                     /* 粗细 ∝ 强度（整体缩小） */
  var arrL = (54 + 28 * twn) * 0.95;              /* 长短 ∝ 强度（拉尼娜约等于旧中性尺寸） */
  var uxw = -0.89, uyw = -0.42;                   /* 指向左上（东北信风，较平缓） */
  var heads = [0.85, 0.60, 0.36];                 /* 三支箭头，对应样图红框三条红线位置 */
  for(var wi = 0; wi < heads.length; wi++){
    var wx1 = bx(heads[wi]), wy1 = yEq + 20;      /* 头部停在环流色带下方，留出间隙 */
    var wx0 = wx1 - uxw * arrL, wy0 = wy1 - uyw * arrL;
    /* 控制点：弦中点向右上偏移 → 箭身微微上凸的浅弧（弧度减小） */
    var bend = arrL * 0.13;
    var cxq = (wx0 + wx1) / 2 + 0.42 * bend;
    var cyq = (wy0 + wy1) / 2 - 0.89 * bend;
    ctx.save();
    ctx.shadowColor = 'rgba(40,70,95,0.5)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1.5;
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = arrW; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(wx0, wy0); ctx.quadraticCurveTo(cxq, cyq, wx1, wy1); ctx.stroke();
    /* 箭头方向取曲线末端切线 */
    var tdx = wx1 - cxq, tdy = wy1 - cyq;
    drawArrowHead(wx1, wy1, tdx, tdy, arrW * 2.6, '#ffffff', 0.95);
    ctx.restore();
  }
  }
  ctx.fillStyle = '#b4551a'; ctx.font = '700 15px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('信风（表层风）', bx(0.55), yEq + 88);

  /* --- 沃克环流（完整闭合墨线环：上升边并入环内，首尾相连） --- */
  if(showLoop){
  var riseX = bx(cur.convU), sinkX = bx(cur.sinkW);
  var loopW = roundedLoop([[riseX, surfY],[riseX, topY],[sinkX, topY],[sinkX, surfY]], 56, 12);
  drawLoop(loopW, 0.06 * (0.45 + 0.55 * clamp(tw, 0.3, 1.7)) * 1.6, 0.85);
  if(cur.loopE > 0.05){
    var sink2 = bx(0.96);
    var topY2 = topY;   /* 厄尔尼诺东侧环流顶边与西侧同高 */
    var loopE = roundedLoop([[rise2, surfY],[rise2, topY2],[sink2, topY2],[sink2, surfY]], 56, 12);
    drawLoop(loopE, 0.06 * 1.1, cur.loopE);
  }

  /* 对流降雨（橙色上升柱已删除；云朵最后单独绘制） */
  drawRain(cxc, 118, 1);
  if(cur.loopE > 0.05){
    drawRain(rise2, 112, cur.loopE);
  }

  /* 云朵最后绘制（置于环流之上） */
  drawClouds();
  }

  /* --- 真实数据标注：距平极值中心 + Niño3.4 框 + 色标 --- */
  if(GODAS){
    var maxV = -9, maxI = -1, minV = 9, minI = -1;
    for(var q5 = 0; q5 < sstaCur.length; q5++){
      var v5 = sstaCur[q5];
      if(isNaN(v5)) continue;
      /* 仅在热带太平洋（15°S–15°N，ENSO 信号区）内找极值，让标注落在对应海域 */
      var lat5 = GODAS.latCenters[Math.floor(q5 / NLON)];
      if(lat5 < -15 || lat5 > 15) continue;
      if(v5 > maxV){ maxV = v5; maxI = q5; }
      if(v5 < minV){ minV = v5; minI = q5; }
    }
    ctx.font = '700 13px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
    ctx.lineJoin = 'round'; ctx.miterLimit = 2;
    if(maxV > 0.6){
      var wp = cellCenter(maxI);
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      var wt = '海温偏高 +' + maxV.toFixed(1) + '°C';
      ctx.strokeText(wt, wp[0], wp[1]); ctx.fillStyle = '#1a1a1a'; ctx.fillText(wt, wp[0], wp[1]);
    }
    if(minV < -0.6){
      var cp = cellCenter(minI);
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      var ct = '海温偏低 ' + minV.toFixed(1) + '°C';
      ctx.strokeText(ct, cp[0], cp[1]); ctx.fillStyle = '#1a1a1a'; ctx.fillText(ct, cp[0], cp[1]);
    }
    /* Niño3.4 监测区（170°W–120°W，5°N–5°S） */
    var n1 = prjLL(190, 5), n2 = prjLL(240, -5);
    ctx.save();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(70,80,90,0.75)'; ctx.lineWidth = 1.3;
    ctx.strokeRect(n1[0], n1[1], n2[0] - n1[0], n2[1] - n1[1]);
    ctx.restore();
    ctx.font = '600 10.5px "Segoe UI", sans-serif'; ctx.fillStyle = 'rgba(70,80,90,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText('Niño 3.4', n1[0] + 4, n1[1] + 12);
    /* SSTA 色标（垂直放置于主图最左侧） */
    var vcbX = 82, vcbY = 204, vcbW = 15, vcbH = 200;
    for(var sv = 0; sv < vcbH; sv++){
      ctx.fillStyle = sstaColor(3.5 - sv / (vcbH - 1) * 7);
      ctx.fillRect(vcbX, vcbY + sv, vcbW, 1.6);
    }
    ctx.strokeStyle = '#9fb0bd'; ctx.lineWidth = 1; ctx.strokeRect(vcbX, vcbY, vcbW, vcbH);
    ctx.font = '10px "Segoe UI", sans-serif'; ctx.textAlign = 'left';
    for(var tk = 3; tk >= -3; tk--){
      var tvy = vcbY + (3.5 - tk) / 7 * vcbH;
      ctx.strokeStyle = '#9fb0bd'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(vcbX + vcbW, tvy); ctx.lineTo(vcbX + vcbW + 4, tvy); ctx.stroke();
      ctx.fillStyle = '#7c8b98';
      ctx.fillText((tk > 0 ? '+' : '') + tk, vcbX + vcbW + 7, tvy + 3.5);
    }
    /* 竖排标题（自下而上） */
    ctx.save();
    ctx.translate(vcbX - 11, vcbY + vcbH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.fillStyle = '#5d6d7e';
    ctx.font = '600 11px "Microsoft YaHei", sans-serif';
    ctx.fillText('海表温度距平 (°C) · GODAS 1°×1°', 0, 0);
    ctx.restore();
  }

  /* --- ENSO 表盘 + 相位标题（样图同款） --- */
  drawDial(1000, 78, 54);
  var ph = PHASES[phaseIdx];
  ctx.textAlign = 'center';
  ctx.font = '700 34px "Microsoft YaHei", sans-serif';
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 6;
  ctx.strokeText(ph.zh, 1000, 186);
  ctx.fillStyle = '#4a5560'; ctx.fillText(ph.zh, 1000, 186);
  if(GODAS){
    var gd = GODAS.phases[ph.mIdx != null ? ph.mIdx : 0];
    var shownYm = selYM || gd.month;
    var shownN = (selYM && selN34 != null) ? selN34 : gd.nino34;
    if(shownN != null){
      ctx.font = '600 12px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#8a97a3';
      var sub = shownYm + ' 实况 · Niño3.4 ' + (shownN > 0 ? '+' : '') + (+shownN).toFixed(2) + '°C';
      if(selInfo && selInfo.real === false && selInfo.month) sub += '（该月无网格数据，显示 ' + selInfo.month + ' 场）';
      else if(shownYm !== gd.month) sub += '（显示' + ph.zh + '代表月 ' + gd.month + ' 场）';
      ctx.fillText(sub, 968, 228);
    }
  }

  /* --- 剖面（样图式海水层结） --- */
  drawSection();
}

/* ENSO 相位表盘 */
function drawDial(dx, dy, r){
  var cols = ['#1d5f96','#7fb2d9','#d4e2ec','#f2dcd4','#e8927c','#c0392b'];
  var a0 = Math.PI, a1 = 2 * Math.PI;
  for(var i = 0; i < 6; i++){
    var sa = a0 + (a1 - a0) * i / 6, ea = a0 + (a1 - a0) * (i + 1) / 6;
    ctx.beginPath();
    ctx.arc(dx, dy, r, sa, ea);
    ctx.arc(dx, dy, r * 0.45, ea, sa, true);
    ctx.closePath();
    ctx.fillStyle = cols[i]; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  var na = a0 + (a1 - a0) * ({0:0.5, 1:0.92, 2:0.13}[phaseIdx]);
  ctx.strokeStyle = '#2f3a44'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(dx, dy);
  ctx.lineTo(dx + Math.cos(na) * (r - 4), dy + Math.sin(na) * (r - 4));
  ctx.stroke();
  ctx.beginPath(); ctx.arc(dx, dy, 4, 0, 7); ctx.fillStyle = '#2f3a44'; ctx.fill();
  ctx.fillStyle = '#8a97a3'; ctx.font = '10px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('拉尼娜', dx - r - 2, dy + 16);
  ctx.fillText('厄尔尼诺', dx + r + 2, dy + 16);
}

/* 拟真积云：多个圆泡 + 垂直明暗渐变 + 顶部高光 + 底部投影 */
function drawCloudPuff(x, y, s, al){
  if(al < 0.03) return;
  ctx.save();
  ctx.globalAlpha = al;
  /* 地表/海面软投影 */
  ctx.beginPath();
  ctx.ellipse(x, y + 30 * s, 54 * s, 12 * s, 0, 0, 7);
  ctx.fillStyle = 'rgba(60,75,90,0.16)';
  ctx.fill();
  /* 云体（先画后景泡再画前景泡，形成层次） */
  var puffs = [[-34,10,19],[36,10,15],[-18,12,18],[6,12,19],[-30,6,20],[16,2,23],[-8,-7,26]];
  var g = ctx.createLinearGradient(0, y - 32 * s, 0, y + 30 * s);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.55, '#f0f3f5');
  g.addColorStop(1, '#a7b3bd');
  ctx.fillStyle = g;
  for(var i = 0; i < puffs.length; i++){
    ctx.beginPath();
    ctx.arc(x + puffs[i][0] * s, y + puffs[i][1] * s, puffs[i][2] * s, 0, 7);
    ctx.fill();
  }
  /* 顶部高光 */
  var hg = ctx.createRadialGradient(x - 10 * s, y - 18 * s, 2, x - 10 * s, y - 18 * s, 26 * s);
  hg.addColorStop(0, 'rgba(255,255,255,0.95)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(x - 10 * s, y - 16 * s, 26 * s, 0, 7); ctx.fill();
  /* 底部灰影（云底变暗更真实） */
  var bg = ctx.createRadialGradient(x, y + 20 * s, 2, x, y + 20 * s, 34 * s);
  bg.addColorStop(0, 'rgba(120,135,148,0.35)');
  bg.addColorStop(1, 'rgba(120,135,148,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(x, y + 18 * s, 34 * s, 0, 7); ctx.fill();
  ctx.restore();
}

function drawRain(cxc, cy, al){
  if(al < 0.03) return;
  var rainLen = (yEq - 10) - (cy + 34);
  var drops = 30;
  for(var i = 0; i < drops; i++){
    var xo = (srand(i) - 0.5) * 110;
    var fall = frac(time * 0.9 * (0.7 + 0.6 * srand(i + 9)) + srand(i + 3)) * rainLen;
    var dy = cy + 38 + fall;
    var aA = al * clamp((rainLen - fall) / 40, 0, 1) * clamp(fall / 15, 0, 1) * 0.85;
    ctx.strokeStyle = 'rgba(70,130,200,' + aA.toFixed(3) + ')';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(cxc + xo, dy); ctx.lineTo(cxc + xo - 3, dy + 13);
    ctx.stroke();
  }
}

/* 云朵统一最后绘制（置于环流色带与箭头之上，更突出） */
function drawClouds(){
  var bob = Math.sin(time * 1.3) * 3;
  drawCloudPuff(bx(cur.convU), 118 + bob, 1.3, 1);
  if(cur.loopE > 0.05) drawCloudPuff(bx(0.70), 112 + bob, 1.3, cur.loopE);
}

/* 颜色明暗调整（f>0 变亮，f<0 变暗），用于立体光泽渐变 */
function shade2(hex, f){
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  if(f >= 0){ r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= (1 + f); g *= (1 + f); b *= (1 + f); }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
/* 两个 hex 颜色线性插值（t=0 返回 a，t=1 返回 b） */
function mixHex(a, b, t){
  var ra = parseInt(a.slice(1, 3), 16), ga = parseInt(a.slice(3, 5), 16), ba = parseInt(a.slice(5, 7), 16);
  var rb = parseInt(b.slice(1, 3), 16), gb = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
  return 'rgb(' + Math.round(ra + (rb - ra) * t) + ',' + Math.round(ga + (gb - ga) * t) + ',' + Math.round(ba + (bb - ba) * t) + ')';
}
/* V 形小箭头（参考样图式：置于环流边上的利落雪佛龙，沿边运动） */
function drawChevron(x, y, ux, uy, w, color, alpha){
  var px = -uy, py = ux;
  var L = w * 1.1, s = w * 0.75;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color; ctx.lineWidth = w * 0.46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x - ux * L + px * s, y - uy * L + py * s);
  ctx.lineTo(x, y);
  ctx.lineTo(x - ux * L - px * s, y - uy * L - py * s);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
/* 样图式扁平大箭头（与色带同色融为一体：利落三角、背部微凹、轻微明暗） */
function ribbonHead(x, y, ux, uy, w, color, alpha){
  var px = -uy, py = ux;
  var back = 2.4 * w, half = 0.95 * w, notch = 0.5 * w;
  ctx.globalAlpha = alpha;
  var hg = ctx.createLinearGradient(x + px * half, y + py * half, x - px * half, y - py * half);
  hg.addColorStop(0, shade2(color, 0.26));
  hg.addColorStop(0.5, color);
  hg.addColorStop(1, shade2(color, -0.28));
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - ux * back + px * half, y - uy * back + py * half);
  ctx.lineTo(x - ux * (back - notch), y - uy * (back - notch));
  ctx.lineTo(x - ux * back - px * half, y - uy * back - py * half);
  ctx.closePath();
  ctx.fill();
  /* 白色描边 */
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, w * 0.22); ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.globalAlpha = 1;
}
/* 立体块状箭头（光泽缎带式：宽扁带缺口三角 + 底部投影 + 横跨宽度亮→暗光泽渐变，颜色由调用方决定） */
function blockHead(x, y, ux, uy, w, color, alpha){
  var px = -uy, py = ux;
  var back = 2.5 * w, half = 1.55 * w, notch = 0.58 * w;
  function tri(ox, oy){
    ctx.beginPath();
    ctx.moveTo(x + ox, y + oy);
    ctx.lineTo(x - ux * back + px * half + ox, y - uy * back + py * half + oy);
    ctx.lineTo(x - ux * (back - notch) + ox, y - uy * (back - notch) + oy);
    ctx.lineTo(x - ux * back - px * half + ox, y - uy * back - py * half + oy);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(30,22,15,0.30)'; tri(0, w * 0.45);      /* 底部投影（厚度感） */
  var hg = ctx.createLinearGradient(x - px * half, y - py * half, x + px * half, y + py * half);
  hg.addColorStop(0, shade2(color, 0.5));                        /* 受光面（亮） */
  hg.addColorStop(0.45, color);
  hg.addColorStop(1, shade2(color, -0.48));                      /* 背光面（暗） */
  ctx.fillStyle = hg; tri(0, 0);
  ctx.globalAlpha = 1;
}

function drawLoop(R, speed, alpha, opts){
  if(alpha < 0.03) return;
  opts = opts || {};
  var cs = R.corners || [], M = 15;
  function inCorner(dd){
    for(var zi = 0; zi < cs.length; zi++){
      var z0 = cs[zi][0] - M, z1 = cs[zi][1] + M;
      if((dd >= z0 && dd <= z1) || (dd + R.L >= z0 && dd + R.L <= z1) || (dd - R.L >= z0 && dd - R.L <= z1)) return true;
    }
    return false;
  }
  /* 采样各直边（向下的支路标蓝色） */
  var LW = 18, sides = [];
  for(var si = 0; si < 4; si++){
    if(opts.skipSides && opts.skipSides.indexOf(si) >= 0) continue;
    var aD = si === 0 ? 0 : cs[(si + 3) % 4][1];
    var bD = cs[si][0];
    var pa = pointAt(R, aD / R.L), pb = pointAt(R, bD / R.L);
    var dx = pb[0] - pa[0], dy = pb[1] - pa[1];
    var len = Math.hypot(dx, dy);
    if(len < 26) continue;
    var pts = [pa];
    for(var dd = aD + 7; dd < bD - 7; dd += 7) pts.push(pointAt(R, dd / R.L));
    pts.push(pb);
    /* 连续直边（手绘式：墨线首尾相接成环） */
    sides.push({ pts: pts, dx: dx, dy: dy, len: len, down: dy > len * 0.5, si: si, aD: aD });
  }
  if(!sides.length) return;
  function strokeRange(S, ia, ib){
    ctx.beginPath();
    ctx.moveTo(S.pts[ia][0], S.pts[ia][1]);
    for(var i = ia + 1; i <= ib; i++) ctx.lineTo(S.pts[i][0], S.pts[i][1]);
    ctx.stroke();
  }
  function strokeSide(S){
    strokeRange(S, 0, S.pts.length - 1);
  }
  ctx.globalAlpha = 0.92 * alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var INK = '#2a2f36';
  /* 箭头颜色随运动位置渐变：底边水平=红 | 上升=橙红 | 顶边水平 橙红→蓝 | 下沉 蓝→橙红 */
  var C_RED = '#d93b22', C_ORGRED = '#e2622a', C_BLU = '#2f76bd';
  function smooth01(t){ t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function sideColor(si, u){
    u = clamp(u, 0, 1);
    if(si === 0) return C_ORGRED;                                                 /* 上升：橙红 */
    if(si === 1) return mixHex(C_ORGRED, C_BLU, smooth01(clamp(u * 1.3, 0, 1)));  /* 顶边：橙红 → 蓝 */
    if(si === 2) return mixHex(C_BLU, C_ORGRED, smooth01(u));                     /* 下沉：蓝 → 橙红 */
    return C_RED;                                                                 /* 底边：红 */
  }
  /* 整环连续平直墨线（仅拐角处以圆弧过渡，roundedLoop 路径自带圆角）；
     skipSides 的直边段不画——该边由对流上升柱充当（拐角圆弧保留以衔接柱子两端） */
  var NL = Math.max(32, Math.round(R.L / 7));
  var skipSegs = [];
  if(opts.skipSides){
    for(var sk = 0; sk < opts.skipSides.length; sk++){
      var ski = opts.skipSides[sk];
      skipSegs.push([ski === 0 ? 0 : cs[(ski + 3) % 4][1], cs[ski][0]]);
    }
  }
  function inSkip(dd){
    for(var z = 0; z < skipSegs.length; z++){
      var a = skipSegs[z][0], b = skipSegs[z][1];
      var L = b - a; if(L < 0) L += R.L;
      if(((dd - a) % R.L + R.L) % R.L < L) return true;
    }
    return false;
  }
  var STEP = R.L / NL;
  var LW = 8.5;                                   /* 环流线宽（17 的一半） */
  /* 线条统一黑色、70% 透明度 */
  ctx.strokeStyle = '#000000'; ctx.lineWidth = LW;
  ctx.globalAlpha = 0.70 * alpha;
  var pen = false;
  for(var k2 = 0; k2 <= NL; k2++){
    var p0 = pointAt(R, (k2 % NL) / NL);
    if(k2 > 0 && inSkip((k2 - 0.5) * STEP)){
      if(pen){ ctx.stroke(); pen = false; }
      continue;
    }
    if(!pen){ ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); pen = true; }
    else ctx.lineTo(p0[0], p0[1]);
  }
  if(pen) ctx.stroke();
  /* 箭头沿边循环滑动（尺寸随线宽减半，颜色仍随运动位置连续渐变） */
  ctx.globalAlpha = 0.92 * alpha;
  for(var s4 = 0; s4 < sides.length; s4++){
    var S4 = sides[s4];
    var ux4 = S4.dx / S4.len, uy4 = S4.dy / S4.len;
    var prog = frac(time * speed * 2.2 + s4 * 0.27);
    var fi = prog * (S4.pts.length - 1);
    var i0 = Math.floor(fi), i1 = Math.min(S4.pts.length - 1, i0 + 1);
    var ft = fi - i0;
    var hx = S4.pts[i0][0] + (S4.pts[i1][0] - S4.pts[i0][0]) * ft;
    var hy = S4.pts[i0][1] + (S4.pts[i1][1] - S4.pts[i0][1]) * ft;
    var fade = clamp(Math.min(prog, 1 - prog) * 8, 0, 1);
    var hcol = sideColor(S4.si, prog);
    ribbonHead(hx, hy, ux4, uy4, LW * 1.35, hcol, 0.95 * alpha * fade);
  }
  ctx.globalAlpha = 1;
}

/* 剖面：GODAS 赤道断面真实温度（0–1000 m，垂直间隔 100 m） */
function drawSection(){
  var w = sx1 - sx0, h = sy1 - sy0;
  /* 真实温度场（离屏 160×11 平滑放大） */
  if(GODAS){
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offSec, 0, 0, NLON, SECH, sx0, sy0, w, h);
    /* 陆地柱：叠加反斜线（"\"方向）纹理 */
    if(profCur){
      ctx.save();
      ctx.beginPath();
      var runStart = -1;
      for(var li = 0; li <= NLON; li++){
        var isLand = li < NLON && isNaN(profCur[li*NDEP]);
        if(isLand && runStart < 0) runStart = li;
        if((!isLand || li === NLON) && runStart >= 0){
          ctx.rect(sx0 + runStart*w/NLON, sy0, (li-runStart)*w/NLON, h);
          runStart = -1;
        }
      }
      ctx.clip();
      ctx.strokeStyle = 'rgba(96,68,40,0.55)'; ctx.lineWidth = 1.3;
      for(var hx = sx0 - h; hx < sx1; hx += 6){
        ctx.beginPath(); ctx.moveTo(hx, sy0); ctx.lineTo(hx + h, sy1); ctx.stroke();
      }
      ctx.restore();
    }
  } else {
    ctx.fillStyle = '#1b7fae'; ctx.fillRect(sx0, sy0, w, h);
  }
  /* 100 m 深度网格线 */
  ctx.save();
  ctx.strokeStyle = 'rgba(30,60,90,0.28)'; ctx.lineWidth = 1;
  for(var d = 100; d < DMAX; d += 100){
    var gy = sy0 + depthFrac(d) * h;
    ctx.beginPath(); ctx.moveTo(sx0, gy); ctx.lineTo(sx1, gy); ctx.stroke();
  }
  ctx.restore();
  /* 20°C 等温线（温跃层） */
  if(GODAS){
    ctx.save();
    ctx.setLineDash([7, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for(var i2 = 0; i2 < NLON; i2++){
      var dd = isoDepth(i2, 20);
      if(isNaN(dd)){ started = false; continue; }
      var x2 = sx0 + i2 / (NLON - 1) * w, y2 = sy0 + depthFrac(Math.min(dd, DMAX)) * h;
      if(!started){ ctx.moveTo(x2, y2); started = true; } else ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    ctx.restore();
    /* 温跃层标注（取西段等温线深度，置于线下方避开 SST 标注） */
    var isoW = isoDepth(24, 20);
    if(!isNaN(isoW)){
      ctx.font = 'italic 700 12px Georgia, serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,60,90,0.6)';
      var thT = '20°C 温跃层';
      var thX = secX(0.28), thY = sy0 + depthFrac(Math.min(isoW, DMAX)) * h + 16;
      ctx.strokeText(thT, thX, thY); ctx.fillStyle = '#ffffff'; ctx.fillText(thT, thX, thY);
    }
  }
  /* 海面波浪线 */
  ctx.beginPath();
  for(var u7 = 0; u7 <= 1.001; u7 += 0.04){
    var wy = sy0 + 2.2 * Math.sin(u7 * 9 + time * 1.8);
    if(u7 === 0) ctx.moveTo(secX(u7), wy); else ctx.lineTo(secX(u7), wy);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.stroke();
  /* 表层 SST 标注（突显表层水温） */
  if(GODAS){
    ctx.font = '700 11.5px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
    /* 四个表层 SST 标注：按网格宽度取比例位置（自适应 1°/2° 网格） */
    var sstFr = [0.16, 0.40, 0.64, 0.88];
    for(var s3 = 0; s3 < sstFr.length; s3++){
      var ii = Math.round(sstFr[s3] * (NLON - 1)), tv = profCur[ii * NDEP];
      if(isNaN(tv)) continue;
      var sX = sx0 + ii / (NLON - 1) * w;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,60,90,0.55)';
      var sT = '海温 ' + tv.toFixed(1) + '°C';
      ctx.strokeText(sT, sX, sy0 + 17);
      ctx.fillStyle = '#ffffff'; ctx.fillText(sT, sX, sy0 + 17);
    }
  }
  /* 深度轴（左侧） */
  ctx.fillStyle = '#5d6d7e'; ctx.font = '10.5px "Segoe UI", sans-serif'; ctx.textAlign = 'right';
  var dticks = [0, 100, 200, 300];
  for(var di = 0; di < dticks.length; di++){
    var d2 = dticks[di];
    ctx.fillText(d2 + '', sx0 - 6, sy0 + depthFrac(d2) * h + 3.5);
  }
  ctx.save();
  ctx.translate(sx0 - 34, sy0 + h / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.fillStyle = '#7c8b98'; ctx.font = '10.5px "Microsoft YaHei", sans-serif';
  ctx.fillText('深度（间隔 100 m）', 0, 0);
  ctx.restore();
  /* 表层洋流箭头 */
  var syA = sy0 + 34;
  if(cur.tw > 0.55){
    drawStraightArrow(secX(0.60), syA, secX(0.20), syA, '#ffffff', 4.5, clamp(cur.tw * 0.75, 0.3, 1));
  } else {
    drawStraightArrow(secX(0.42), syA, secX(0.86), syA, '#ffe0d6', 4.5, clamp((0.6 - cur.tw) * 2, 0.2, 0.95));
  }
  /* 上升流（东端沿海）：拉尼娜时按强度夸张显示（更粗、更长、更大箭头、更快流速） */
  var upx = secX(0.915);
  var upA = clamp(cur.up * 0.8, 0.12, 1);
  var upK = clamp((cur.up - 1) / 0.6, 0, 1);      /* 0 正常 → 1 拉尼娜夸张档 */
  var upBase = sy0 + 0.70 * h + 36 * upK;         /* 起点更深 → 箭身更长 */
  if(GODAS){
    var isoE = isoDepth(Math.min(NLON - 1, Math.round(0.915 * (NLON - 1))), 20);
    if(!isNaN(isoE)) upBase = sy0 + depthFrac(Math.min(isoE, DMAX)) * h + 26 + 30 * upK;
  }
  /* 箭头：严格竖直向上的实心箭头（箭身竖直，头部端正向上） */
  var tipY = sy0 + 16;
  var hL = 17 + 9 * upK, hW = 11 + 6 * upK;
  ctx.save();
  ctx.shadowColor = 'rgba(180,230,255,' + (0.55 * upK).toFixed(3) + ')';
  ctx.shadowBlur = 10 * upK;
  /* 箭身：竖直直线，末端没入头部 */
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.92 * upA).toFixed(3) + ')';
  ctx.lineWidth = 4.5 + 2.5 * upK;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(upx, upBase);
  ctx.lineTo(upx, tipY + hL * 0.6);
  ctx.stroke();
  /* 实心头部（端正向上，背部微凹） */
  ctx.fillStyle = 'rgba(255,255,255,' + (0.95 * upA).toFixed(3) + ')';
  ctx.beginPath();
  ctx.moveTo(upx, tipY);
  ctx.lineTo(upx + hW, tipY + hL);
  ctx.lineTo(upx, tipY + hL * 0.52);
  ctx.lineTo(upx - hW, tipY + hL);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  var upTxt = cur.up < 0.5 ? '上升流受抑制' : (cur.up > 1.2 ? '上升流增强' : '上升流');
  ctx.font = 'italic 700 ' + (13 + 2.5 * upK).toFixed(1) + 'px Georgia, serif';
  var upTx = Math.min(upx + 50, sx1 - 8);         /* 文字紧贴上升流箭头正下方（右对齐防出界） */
  var upTy = Math.min(upBase + 28, sy1 - 10);
  ctx.textAlign = 'right';
  if(upK > 0.4){ ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,60,100,0.55)'; ctx.strokeText(upTxt, upTx, upTy); }
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText(upTxt, upTx, upTy);
  /* 剖面标题 + 温度色标（标题置于剖面下方，避开地图经度刻度） */
  ctx.fillStyle = '#5d6d7e'; ctx.font = '600 11.5px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('赤道太平洋纵剖面 · 海水温度 °C（GODAS 0–350 m）', sx0, sy1 + 20);
  var cbx = sx1 - 190, cby = sy1 + 10, cbw = 160, cbh = 10;
  for(var si3 = 0; si3 < cbw; si3++){
    ctx.fillStyle = tempColor(4 + si3 / (cbw - 1) * 26.5);
    ctx.fillRect(cbx + si3, cby, 1.5, cbh);
  }
  ctx.strokeStyle = '#9fb0bd'; ctx.lineWidth = 1; ctx.strokeRect(cbx, cby, cbw, cbh);
  ctx.fillStyle = '#7c8b98'; ctx.font = '10px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
  var tks = [4, 12, 20, 28, 30.5];
  for(var t4 = 0; t4 < tks.length; t4++){
    ctx.fillText(tks[t4], cbx + (tks[t4] - 4) / 26.5 * cbw, cby + cbh + 11);
  }
  /* 外框 */
  ctx.strokeStyle = '#9fb0bd'; ctx.lineWidth = 1.5;
  ctx.strokeRect(sx0, sy0, w, h);
  /* 经度刻线：剖面顶边短刻线 + 垂直连接线连到上方经度数字底部 */
  ctx.lineWidth = 1;
  for(var lt = 0; lt < MAPTICKS.length; lt++){
    var lx = secX((MAPTICKS[lt][0] - LON0) / (LON1 - LON0));
    if(lx < sx0 - 0.5 || lx > sx1 + 0.5) continue;
    /* 剖面顶边白色短刻线（伸入海水，便于在色块上辨认） */
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.moveTo(lx, sy0); ctx.lineTo(lx, sy0 + 7); ctx.stroke();
    /* 垂直连接线：从刻线顶端连到经度数字下方 */
    ctx.strokeStyle = 'rgba(140,155,170,0.7)';
    ctx.beginPath(); ctx.moveTo(lx, sy0); ctx.lineTo(lx, MAPB + 25); ctx.stroke();
  }
}

/* ---------- UI ---------- */
var showLoop = true, showTrade = true;
function wireToggle(btnId, get, set){
  var b = document.getElementById(btnId);
  b.onclick = function(){
    set(!get());
    b.className = get() ? 'tg-on' : 'tg-off';
  };
}
wireToggle('bLoop',  function(){ return showLoop;  }, function(v){ showLoop = v;  });
wireToggle('bTrade', function(){ return showTrade; }, function(v){ showTrade = v; });
var cardsBox = document.getElementById('cards');
var chipsBox = document.getElementById('chips');
function buildCards(){
  var html = '';
  for(var i = 0; i < PHASES.length; i++){
    html += '<div class="stepcard ' + PHASES[i].key + '" data-i="' + i + '">' +
      '<div class="t"><span>' + PHASES[i].zh + '</span></div>' +
      '<div class="d">' + PHASES[i].desc + '</div></div>';
  }
  cardsBox.innerHTML = html;
  var cards = cardsBox.children;
  for(var j = 0; j < cards.length; j++){
    cards[j].onclick = function(){
      var idx = parseInt(this.getAttribute('data-i'), 10);
      gotoRandomYm(PHASES[idx].key);   /* 随机选该相位的一个月份，经 apply() 联动主图与下拉框 */
    };
  }
}
/* 点击相位卡片 → 从该相位的所有历史月份中随机选一个，同步年、月下拉框并跳转 */
function gotoRandomYm(key){
  var cands = [], list = GODAS.n34ts || [];
  for(var i = 0; i < list.length; i++){
    var v = list[i].v;
    if(v == null) continue;
    if(key === 'elnino' && v >= 0.5) cands.push(list[i].ym);
    else if(key === 'lanina' && v <= -0.5) cands.push(list[i].ym);
    else if(key === 'neutral' && v > -0.5 && v < 0.5) cands.push(list[i].ym);
  }
  if(!cands.length){ setPhase(PHASES.reduce(function(a, p, i){ return p.key === key ? i : a; }, 0)); return; }
  var ym = cands[Math.floor(Math.random() * cands.length)];
  var p2 = ym.split('-');
  var selY = document.getElementById('selYear'), selM = document.getElementById('selMonth');
  if(selY.value !== p2[0]){ selY.value = p2[0]; selY.onchange(); }  /* onchange 会重建月份列表 */
  if(selM.value !== p2[1]){ selM.value = p2[1]; selM.onchange(); }  /* onchange 触发 apply() */
}
function buildChips(){
  var ph = PHASES[phaseIdx];
  var html = '';
  for(var i = 0; i < ph.chips.length; i++){
    var cls = 'chip';
    if(i <= 1) cls += ph.key === 'lanina' ? ' cold' : (ph.key === 'elnino' ? ' hot' : '');
    html += '<span class="' + cls + '">' + ph.chips[i] + '</span>';
    if(i < ph.chips.length - 1) html += '<span class="arrow">→</span>';
  }
  chipsBox.innerHTML = html;
  var chips = chipsBox.querySelectorAll('.chip');
  for(var j = 0; j < chips.length; j++){
    (function(el, k){
      setTimeout(function(){ el.classList.add('on'); }, 60 + k * 90);
    })(chips[j], j);
  }
}
function syncCards(){
  var cards = cardsBox.children;
  for(var i = 0; i < cards.length; i++){
    cards[i].classList.remove('active');
  }
  cards[phaseIdx].classList.add('active');
}
function setPhase(i){
  phaseIdx = ((i % PHASES.length) + PHASES.length) % PHASES.length;
  target = PHASES[phaseIdx].p;
  autoT = 0;
  syncCards();
  buildChips();
}

var playing = true, speed = 1, autoT = 0;
var bPlay = document.getElementById('bPlay');
bPlay.onclick = function(){
  playing = !playing;
  bPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
};
/* 上一步/下一步：切到相邻相位，并随机选该相位的一个月份同步到左上角年月下拉 */
function stepPhase(d){
  var ni = ((phaseIdx + d) % PHASES.length + PHASES.length) % PHASES.length;
  gotoRandomYm(PHASES[ni].key);   /* 设置下拉框并经 apply() 完成相位跳转 */
}
document.getElementById('bPrev').onclick = function(){ stepPhase(-1); };
document.getElementById('bNext').onclick = function(){ stepPhase(1); };
document.getElementById('speed').oninput = function(){
  speed = parseFloat(this.value);
  document.getElementById('speedTxt').textContent = speed.toFixed(1) + '×';
};

/* ---------- 主循环 ---------- */
var lastTs = null;
function frame(ts){
  if(lastTs === null) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if(playing){
    time += dt * speed;
    var f = 1 - Math.exp(-dt * speed * 2.2);
    for(var k in cur){ cur[k] += (target[k] - cur[k]) * f; }
    /* 真实海洋数据场随相位平滑过渡（使用当前相位选定的年份条目） */
    if(GODAS){
      var gdT = GODAS.phases[PHASES[phaseIdx].mIdx != null ? PHASES[phaseIdx].mIdx : 0];
      for(var q4 = 0; q4 < sstaCur.length; q4++){
        var a4 = sstaCur[q4], bb4 = gdT.ssta[q4];
        var nv4 = (isNaN(a4) || isNaN(bb4)) ? bb4 : a4 + (bb4 - a4) * f;
        if(!dataDirty && !(isNaN(a4) && isNaN(bb4)) && (isNaN(nv4) || Math.abs(nv4 - a4) > 0.02)) dataDirty = true;
        sstaCur[q4] = nv4;
      }
      for(var q6 = 0; q6 < profCur.length; q6++){
        var a6 = profCur[q6], bb6 = gdT.prof[q6];
        var nv6 = (isNaN(a6) || isNaN(bb6)) ? bb6 : a6 + (bb6 - a6) * f;
        if(!dataDirty && !(isNaN(a6) && isNaN(bb6)) && (isNaN(nv6) || Math.abs(nv6 - a6) > 0.02)) dataDirty = true;
        profCur[q6] = nv6;
      }
    }
  }
  maybeRebuildData(ts);
  render();
  requestAnimationFrame(frame);
}
buildCards();
syncCards();
buildChips();
if(GODAS) initGodas();
requestAnimationFrame(frame);
</script>
</body>
